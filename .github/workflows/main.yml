name: Recipe Book CI
on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['12.x']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build
      # - name: Test
        # run: npm run test
